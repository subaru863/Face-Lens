<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FaceLens</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>

<body>

    <!-- HOME -->
    <section id="home" class="page">
        <header>
            <div class="logo">
                <div class="logo-icon">F</div>
                <span>FaceLens</span>
            </div>
        </header>

        <main class="home-content">
            <div class="hero-icon">◉</div>

            <h1>FaceLens</h1>

            <p class="subtitle">
                AI-powered face analysis
            </p>

            <button id="startBtn" class="primary-btn">
                Start Scan
            </button>

            <p class="small-text">
                Camera access is required
            </p>
        </main>
    </section>


    <!-- CAMERA -->
    <section id="cameraPage" class="camera-page hidden">

        <div class="camera-container">

            <video id="video" autoplay muted playsinline></video>

            <!-- Face detection box -->
            <div id="faceBox"></div>

            <div id="countdown" class="countdown"></div>

            <div id="scanStatus" class="scan-status">
                Preparing camera...
            </div>

        </div>

        <div class="camera-controls">

            <button id="flipBtn" class="control-btn">
                🔄 Flip
            </button>

            <button id="closeBtn" class="control-btn close-btn">
                ✕ Close
            </button>

        </div>

    </section>


    <!-- RESULTS -->
    <section id="resultPage" class="page hidden">

        <header>
            <div class="logo">
                <div class="logo-icon">F</div>
                <span>FaceLens</span>
            </div>
        </header>

        <main class="result-content">

            <h1>Analysis Complete</h1>

            <p class="subtitle">
                Your face analysis result
            </p>

            <div class="results-card">

                <div class="result-item">
                    <span class="result-label">Age</span>
                    <span id="ageResult" class="result-value">--</span>
                </div>

                <div class="result-item">
                    <span class="result-label">Gender</span>
                    <span id="genderResult" class="result-value">--</span>
                </div>

                <div class="result-item">
                    <span class="result-label">Expression</span>
                    <span id="expressionResult" class="result-value">--</span>
                </div>

            </div>

            <button id="againBtn" class="primary-btn">
                Scan Again
            </button>

        </main>

    </section>


    <script src="script.js"></script>

</body>
</html>
